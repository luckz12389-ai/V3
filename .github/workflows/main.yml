name: RDP-Gaming

on:
  workflow_dispatch:
    inputs:
      install_steam:
        description: 'Instalar Steam'
        required: false
        default: 'true'
      install_gaming_tools:
        description: 'Instalar ferramentas de jogo (ViGEmBus, DS4Windows)'
        required: false
        default: 'true'
      install_browsers:
        description: 'Instalar navegadores (Chrome, Firefox)'
        required: false
        default: 'true'
      install_dev_tools:
        description: 'Instalar ferramentas de dev (VSCode, Git, Node, Python)'
        required: false
        default: 'true'

jobs:
  secure-rdp-gaming:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ============================================================
      # 1. CONFIGURAÇÃO DO RDP
      # ============================================================
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      # ============================================================
      # 2. OTIMIZAÇÕES DE SISTEMA PARA JOGOS / RDP
      # ============================================================
      - name: Optimize System for Gaming / RDP
        run: |
          powercfg -h off
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
                           -Name 'VisualFXSetting' -Value 2 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' `
                           -Name 'Win32PrioritySeparation' -Value 38 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection' `
                           -Name 'AllowTelemetry' -Value 0 -Force -ErrorAction SilentlyContinue
          Write-Host "Sistema otimizado."

      # ============================================================
      # 3. CRIAÇÃO DE USUÁRIO RDP
      # ============================================================
      - name: Create RDP User with Secure Password
        id: creds
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword  = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password     = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass   = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators"        -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users"  -Member "RDP"

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ============================================================
      # 4. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        run: |
          $tsUrl         = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
              --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
              --hostname=gh-gaming-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ============================================================
      # 5. SUPORTE A JOYSTICK / GAMEPAD (CORRIGIDO)
      # ============================================================
      - name: Install ViGEmBus (Virtual Gamepad Driver)
        if: ${{ github.event.inputs.install_gaming_tools == 'true' }}
        run: |
          $url = "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          $out = "$env:TEMP\ViGEmBus.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/quiet /norestart" -Wait
          Remove-Item $out -Force
          Write-Host "ViGEmBus instalado."

      - name: Install DS4Windows via Chocolatey
        if: ${{ github.event.inputs.install_gaming_tools == 'true' }}
        run: |
          # O Chocolatey resolve o link quebrado baixando o app Windows diretamente
          choco install ds4windows -y --no-progress
          Write-Host "DS4Windows instalado."

      # ============================================================
      # 6. FERRAMENTAS DE JOGO
      # ============================================================
      - name: Install Steam
        if: ${{ github.event.inputs.install_steam == 'true' }}
        run: |
          $url = "https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe"
          $out = "$env:TEMP\SteamSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/S" -Wait
          Remove-Item $out -Force
          Write-Host "Steam instalada."

      - name: Install Epic Games Launcher (opcional)
        if: ${{ github.event.inputs.install_steam == 'true' }}
        continue-on-error: true
        run: |
          $url = "https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi"
          $out = "$env:TEMP\EpicGames.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process msiexec.exe -ArgumentList "/i", "`"$out`"", "/quiet", "/norestart" -Wait
          Remove-Item $out -Force

      # ============================================================
      # 7. NAVEGADORES
      # ============================================================
      - name: Install Google Chrome
        if: ${{ github.event.inputs.install_browsers == 'true' }}
        run: |
          $url = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $out = "$env:TEMP\chrome.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/silent /install" -Wait
          Remove-Item $out -Force

      - name: Install Firefox
        if: ${{ github.event.inputs.install_browsers == 'true' }}
        run: |
          $url = "https://download.mozilla.org/?product=firefox-latest&os=win64&lang=pt-BR"
          $out = "$env:TEMP\firefox.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/S" -Wait
          Remove-Item $out -Force

      # ============================================================
      # 8. FERRAMENTAS DE DEV
      # ============================================================
      - name: Install Dev Tools (Git, Node, Python, VSCode)
        if: ${{ github.event.inputs.install_dev_tools == 'true' }}
        run: |
          choco install -y git nodejs-lts python vscode 7zip --no-progress
          git --version
          node --version
          python --version

      - name: Install Emuladores (RetroArch - opcional)
        if: ${{ github.event.inputs.install_gaming_tools == 'true' }}
        continue-on-error: true
        run: |
          choco install -y retroarch --no-progress

      # ============================================================
      # 9. VERIFICAÇÃO E RESUMO
      # ============================================================
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "Conectividade TCP OK!"

      - name: Show Access Info
        run: |
          Write-Host ""
          Write-Host "==========================================="
          Write-Host "        ACESSO RDP GAMING - READY"
          Write-Host "==========================================="
          Write-Host " Endereço : $env:TAILSCALE_IP"
          Write-Host " Usuário  : RDP"
          Write-Host " Senha    : $env:RDP_PASSWORD"
          Write-Host "==========================================="
          Write-Host " Dicas:"
          Write-Host "  - Use mstsc.exe para conectar."
          Write-Host "  - O DS4Windows foi instalado via Chocolatey."
          Write-Host "  - Ative o redirecionamento USB no RDP para usar o controle."
          Write-Host "==========================================="

      - name: Maintain Connection
        run: |
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP ativo - IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
